# Converter for Media: supported Nginx negotiation, not the Pass Thru HTML loader.
# Include inside server {}, BEFORE other regex locations/includes.
# Reference: https://mattplugins.com/docs/nginx-configuration
set $ext_webp ".webp";
if ($http_accept !~* "image/webp") {
    set $ext_webp "";
}
location ~* ^/wp-content/(?<path>(?:uploads|themes)/.+)\.(?<ext>jpe?g|png|gif|webp)$ {
    add_header Vary Accept always;
    add_header Cache-Control "private";
    expires 5m;
    try_files /wp-content/uploads-webpc/$path.$ext$ext_webp $uri =404;
}