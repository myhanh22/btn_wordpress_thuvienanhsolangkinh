# Include inside this site's server {} through LocalWP's persistent templates.
autoindex off;
server_tokens off;
fastcgi_hide_header X-Powered-By;

location = /xmlrpc.php { return 403; }
location = /readme.html { return 403; }
location = /wp-config.php { return 403; }
location = /wp-config-sample.php { return 403; }

# An installed site does not need public installation/configuration wizards.
location = /wp-admin/install.php { return 403; }
location = /wp-admin/setup-config.php { return 403; }
